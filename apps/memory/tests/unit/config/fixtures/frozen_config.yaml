# Frozen config fixture — STRICTLY for tests. Decoupled from the human-tuned
# configs/default.yaml (which operators edit freely). Tests assert on the
# values here, so changes are intentional and local to the test suite.
# Holds ONLY static memory config — sources moved out to repo-root `sources/`
# (ADR-003); the source files are covered by test_sources_files.py.

memory:
  mode: graphrag
  # Two-level chunking (ADR-006 §6). Sizes are tiktoken `cl100k_base` TOKENS.
  #   strategy — the same splitter at both levels:
  #     recursive     markdown headings -> paragraphs -> sentences -> tokens,
  #                   greedily merged up to `size`; parents carry a heading_path.
  #     fixed_tokens  plain sliding token window (the Chapter-4 first version).
  #   parent — retrieval + LLM-extraction unit, never embedded.
  #   child  — the embedded search unit; must stay smaller than the parent.
  # Env overrides work as usual, e.g. TREE_MEMORY__CHUNKING__CHILD__SIZE=128.
  chunking:
    strategy: recursive
    parent:
      size: 4096
      overlap: 0
    child:
      size: 256
      overlap: 32
  # Embedding clustering (ADR-007 §1): UMAP -> HDBSCAN in the 5-d
  # intermediate -> a separate 2-D UMAP for display -> one LLM summary per
  # cluster. No `enabled` key — the switch is the `run_clustering` flow
  # parameter. The prose lives in configs/default.yaml.
  clustering:
    umap:
      n_neighbors: 15 # local neighbourhood size; clamped to n-1 on small corpora
      min_dist: 0.0 # 0 = tightest clumps (BERTopic default for clustering)
      metric: cosine # embeddings are cosine-normalised
      n_components: 5 # the intermediate space HDBSCAN clusters in (display is always 2D)
      random_state: 42 # one seed for both UMAP fits + the sampling RNG
    hdbscan:
      min_cluster_size: 15
      min_samples: null # null = min_cluster_size (sklearn default)
    sampling:
      nearest: 10 # chunks nearest the centroid (cosine, original 1024-d space)
      random: 10 # seeded random chunks from the remainder
    summaries:
      llm_concurrency: 5 # concurrent Gemini calls (one call per cluster)

models:
  llm:
    provider: gemini
    model: gemini-3.1-flash-lite
  resolution_embedding:
    provider: voyage
    model: voyage-4
    dimensions: 1024
  search_embedding:
    provider: voyage
    model: voyage-4
    dimensions: 1024
  embedding_batch:
    max_inputs: 1000
    max_total_tokens: 10000
    max_input_tokens: 32000
    dispatch_concurrency: 1

extraction:
  llm_concurrency: 5
  doc_concurrency: 1
  dedup_concurrency: 8
  resolution:
    fuzzy_threshold: 0.85
    semantic_threshold: 0.80
    type_strict: true
    max_candidates_per_type: 1000
    embedding_cache_max_size: 10000
  dedup:
    enabled: true
    auto_merge_threshold: 0.95
    flag_threshold: 0.85
    use_fuzzy_matching: true
    fuzzy_threshold: 0.90
    max_candidates: 10
    match_same_type_only: true
    merge_strategy: keep_primary
    supersession_candidate_cap: 8

query:
  top_k: 10
  max_hops: 1
  rrf_k: 60
  embedding_batch_size: 64
  # Bar the VECTOR leg of the hybrid search must clear BEFORE fusion; $text
  # hits are never gated. Atlas normalises cosine to (1 + cos) / 2, so this is
  # an absolute similarity (the RRF score is not). PROVISIONAL and owned by
  # Chapter 7's evals. Override with TREE_QUERY__MIN_VECTOR_SCORE=...
  # re-pinned on voyage-4, 2026-09 — tasks/141 Log (nonsense top=0.649,
  # on-topic top=0.735; the voyage-3.5 pin of 0.75 kept nothing on topic).
  min_vector_score: 0.70

dream:
  enabled: true
  cron: "0 4 * * *"
  dry_run: true
  max_pairs: 10000
  enable_supersession_judge: false

concurrency:
  voyage_rpm: 3
  voyage_tpm: 10000
  runner_global_limit: 4

mcp:
  max_retries: 1
  max_results: 10

youtube:
  brightdata_timeout_seconds: 600
  brightdata_poll_interval_seconds: 10

observability:
  enabled: true
  embedding_price_per_1m_tokens:
    voyage-3.5: 0.06

# The Modal catalog (ADR-009 §2/§3). Mirrors the SHAPE of the shipped
# configs/default.yaml — the seed VALUES (revisions, prompts) are asserted
# against the real file, not against this fixture. The ENGINE PINS are the one
# exception (`test_engine_pins`): a bump that moves the YAML and the code
# default but forgets this file would leave the fixture describing an image
# nobody builds.
modal:
  autoinference_utils_version: "0.2.6"
  engines:
    vllm:
      version: "0.26.0"
    sglang:
      version: "v0.5.18"
  warmup_deadline_s: 600
  # Waiting for ONE answer, not for a cold server (ADR-009 §11).
  request_timeout_s: 300
  embedding_models:
    # A minimal entry: a repo id, a revision and the measured vector width —
    # nothing about HOW it is served.
    - repo_id: Qwen/Qwen3-Embedding-0.6B
      revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      native_dimensions: 1024
    # An entry carrying the App fields, which only the App scripts read.
    - repo_id: voyageai/voyage-4-nano
      revision: 67fabc9bef010dabc5f6024aa1b1b6b93410426f
      gpu: A10
      cpu: 4
      memory_mb: 16384
      native_dimensions: 2048
      matryoshka_dimensions: [256, 512, 1024, 2048]
      max_model_len: 32768
      query_prompt: "Represent the query for retrieving supporting documents: "
      document_prompt: "Represent the document for retrieval: "
      extra_server_args:
        "--convert": embed
        "--pooler-config": '{"pooling_type":"MEAN"}'
  llm_models:
    # The LLM half of the catalog: the same entry minus the embedding facts,
    # plus `n_gpus` (SGLang's tp) and the two client-side request knobs.
    - repo_id: Qwen/Qwen3.5-0.8B
      revision: 2fc06364715b967f1860aea9cf38778875588b17
      max_tokens: 4096
      chat_template_kwargs:
        enable_thinking: false
    - repo_id: LiquidAI/LFM2.5-350M
      revision: 9e6c6ccf47cd318696e137d381a7ded8fe4df09f
      gpu: A10
      n_gpus: 1
      max_tokens: 4096
      max_model_len: 32768
