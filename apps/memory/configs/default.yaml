# Override per-environment by setting APP_CONFIG_PATH to a different YAML file.
#
# This file holds ONLY static memory config (models, extraction, query, dream,
# concurrency, prefect, mcp, observability).

# Memory modes (ADR-006). ONE switch decides how much of the memory half runs:
#   rag      — clean -> two-level chunk (parent/child) -> embed children ->
#              load rows; retrieval is parent-document hybrid search
#              (vector + text, RRF) over child chunks. Node rows only:
#              no edges, no LLM entity extraction. (The Chapter-4 system.)
#   graphrag — everything `rag` does PLUS structural edges (part_of, next),
#              LLM entity extraction over parent chunks, entity resolution,
#              dedup, `mentions` edges, and graph expansion at retrieval.
#              (What Chapter 8 adds.)

memory:
  mode: graphrag
  # Two-level chunking (ADR-006 §6). Sizes are tiktoken `cl100k_base` TOKENS.
  #   strategy — the same splitter at both levels:
  #     recursive     markdown headings -> paragraphs -> sentences -> tokens,
  #                   greedily merged up to `size`; parents carry a heading_path.
  #     fixed_tokens  plain sliding token window (the Chapter-4 first version).
  #   parent — retrieval + LLM-extraction unit, never embedded.
  #   child  — the embedded search unit; must stay smaller than the parent.
  # Env overrides work as usual, e.g. TREE_MEMORY__CHUNKING__CHILD__SIZE=128.
  chunking:
    strategy: recursive
    parent:
      size: 4096
      overlap: 0
    child:
      size: 256
      overlap: 32
  # Embedding clustering (ADR-007 §1) — the BERTopic-shaped recipe:
  #   UMAP to `umap.n_components` dims -> HDBSCAN there -> a SEPARATE UMAP to
  #   2-D (fit on the RAW 1024-d embeddings, same seed) for display -> one LLM
  #   summary per cluster.
  # We cluster in the 5-d intermediate and never on the 2D projection: two
  # dimensions destroy neighbourhood structure to make a picture, so clusters
  # read off a 2-D plot are artefacts of the projection (min_dist, seed), not
  # of the data.
  # There is deliberately NO `enabled` key: the ON/OFF switch is the
  # `run_clustering` flow parameter of offline_pipeline (default false; the
  # nightly cron leaves it off). A second switch here could contradict it, so
  # an `enabled` key is a hard ValidationError.
  # Env overrides work as usual, e.g.
  # TREE_MEMORY__CLUSTERING__HDBSCAN__MIN_CLUSTER_SIZE=5 for a small corpus —
  # set them where the FLOW runs (the `make memory-serve-workflows` process,
  # or the deployment's env), never in the shell that dispatches the run.
  clustering:
    umap:
      n_neighbors: 15 # local neighbourhood size; clamped to n-1 on small corpora
      min_dist: 0.0 # 0 = tightest clumps (BERTopic default for clustering)
      metric: cosine # embeddings are cosine-normalised
      n_components: 5 # the intermediate space HDBSCAN clusters in (display is always 2D)
      random_state: 42 # one seed for both UMAP fits + the sampling RNG
    hdbscan:
      min_cluster_size: 15
      min_samples: null # null = min_cluster_size (sklearn default)
    sampling:
      nearest: 10 # chunks nearest the centroid (cosine, original 1024-d space)
      random: 10 # seeded random chunks from the remainder
    summaries:
      llm_concurrency: 5 # concurrent Gemini calls (one call per cluster)

models:
  llm:
    provider: gemini
    model: gemini-3.1-flash-lite
  # Transient embedding used only by resolution's semantic stage
  # (computed on the entity NAME, dropped afterward, never persisted).
  resolution_embedding:
    provider: voyage
    model: voyage-4
    dimensions: 1024
  # Persisted embedding used for dedup + search/query. Its output is the
  # node `embedding` field and the live mongot `vector_index`
  search_embedding:
    provider: voyage
    model: voyage-4
    dimensions: 1024
  embedding_batch:
    max_inputs: 1000
    max_total_tokens: 10000
    max_input_tokens: 32000
    dispatch_concurrency: 1

extraction:
  llm_concurrency: 5
  doc_concurrency: 1
  dedup_concurrency: 8
  resolution:
    fuzzy_threshold: 0.85
    semantic_threshold: 0.80
    type_strict: true
    max_candidates_per_type: 1000
    embedding_cache_max_size: 10000
  dedup:
    enabled: true
    auto_merge_threshold: 0.95
    flag_threshold: 0.85
    use_fuzzy_matching: true
    fuzzy_threshold: 0.90
    max_candidates: 10
    match_same_type_only: true
    merge_strategy: keep_primary
    supersession_candidate_cap: 8

query:
  top_k: 10
  max_hops: 1
  rrf_k: 60
  embedding_batch_size: 64
  # Bar the VECTOR leg of the hybrid search must clear BEFORE fusion; $text
  # hits are never gated. Atlas normalises cosine to (1 + cos) / 2, so this is
  # an absolute similarity (the RRF score is not). PROVISIONAL — pinned by the
  # two live queries in tasks/125's log (nonsense query top=0.728, on-topic
  # top=0.882, so ADR-008 §4's proposed 0.65 let EVERY candidate through) and
  # owned by Chapter 7's evals. Override with TREE_QUERY__MIN_VECTOR_SCORE=...
  min_vector_score: 0.75

dream:
  enabled: true
  cron: "0 4 * * *"
  dry_run: true
  # Cap on candidate pairs examined per run. Once hit, the sweep stops
  # driving and records cap_hit=True in its stats.
  max_pairs: 10000
  # Gate for the LLM contradiction/supersession sweep (#052). Off by
  # default: prefs/facts get the normal semantic + fuzzy dedup with ZERO
  # LLM calls. Flip to true to run the Gemini contradiction judge over the
  # incremental delta (cost: bounded LLM calls per partition).
  enable_supersession_judge: false

# Pipeline-parallelism + Voyage rate-limiting
concurrency:
  # Requests/minute the shared free-tier Voyage key allows. Drives the
  # server-side `voyage-embeddings` Prefect global concurrency limit
  # (limit = voyage_rpm, slot-decay-per-second = voyage_rpm / 60). Create/update
  # it on the Prefect server with `prefect gcl create voyage-embeddings --limit
  # <voyage_rpm> --slot-decay-per-second <voyage_rpm/60>`. Raise this + re-run
  # that command after adding a payment method — no code change needed.
  voyage_rpm: 3
  # Tokens/minute the key allows. Held by config (the embedding_batch
  # max_total_tokens cap), not yet a second token-weighted limiter.
  voyage_tpm: 10000
  # Prefect runner global concurrency limit
  runner_global_limit: 6

prefect:
  # Register the OPTIONAL deployments (optional=True in orchestrator.py). Prefect
  # Cloud's FREE TIER caps a workspace at 5 deployments and the core set spends all
  # 5 — see README.md "Serving workflows". Set true on a paid plan or a self-hosted
  # server. (Env override: TREE_PREFECT__DEPLOY_OPTIONAL=true.)
  deploy_optional: false

mcp:
  max_retries: 1
  max_results: 10

# YouTube ETL: the bounded wait for ONE Bright Data transcript collection
# (ADR-004). Credential presence is the backend switch — there is no `enabled`
# flag and no new env var.
youtube:
  # Measured: ~173s to collect a single video; 600 matches the Bright Data CLI
  # default. Hitting it falls the whole batch back to Gemini, it is not a failure.
  brightdata_timeout_seconds: 600
  brightdata_poll_interval_seconds: 10

# The Modal catalog (ADR-009 §2/§3): one entry per Hugging Face model that may
# be served on Modal, read by BOTH the deploy driver and the clients so names,
# dimensions and prompts have ONE source. Adding a model = one entry here + one
# `make memory-deploy-model MODEL=<repo_id>`; an unknown id fails loudly listing
# these ids.
#
# An entry says WHICH model and the facts about it — never HOW it is served.
# At deploy the driver asks Modal first (`modal endpoint create`) and, when
# Modal refuses, deploys our App for the entry's KIND: an `embedding_models`
# entry goes to deploy/modal_vllm_embedding.py, an `llm_models` entry to
# deploy/modal_sglang_llm.py. The chosen route is in the driver's one
# `Routing …` log line, not in this file.
#
# `gpu`, `cpu`, `memory_mb`, `max_model_len`, `extra_server_args` (and `n_gpus`
# on an LLM) are read by the APP scripts only — a Dedicated endpoint never sees
# them — but they stay allowed (with defaults) on every entry, because nobody
# can predict Modal's refusal while writing the entry. `extra_server_args`
# values may NOT contain whitespace: autoinference-utils splits them into argv
# tokens, so use compact JSON.
# NOTE: the TREE_<SECTION>__<KEY> escape hatch does NOT reach list items — edit
# this file to change a catalog entry.
modal:
  autoinference_utils_version: "0.2.6" # App scripts only
  engines: # App scripts only; per ENGINE, not per model
    vllm:
      version: "0.26.0" # a PyPI version (`vllm==0.26.0`); Modal's own embedding recipe pin (serve.py, 2026-09-20)
    sglang:
      # A DOCKER TAG of lmsysorg/sglang, NOT a PyPI version: the SGLang App
      # runs the official image, like Modal's own LLM recipe. At v0.5.18 the
      # plain tag IS the CUDA 13 build — sglang's release-docker.yml gives the
      # cu130 image the tags v0.5.18 / latest / v0.5.18-cu130 — and Modal's
      # hosts run driver 580.95.05 with CUDA Driver API 13.0.
      version: "v0.5.18"
  # ~3x the slowest boot measured (199 s); 300 s (client) and 1200 s (smoke test) before #144
  warmup_deadline_s: 600
  embedding_models:
    # In Modal's endpoint catalog (2026-09-20) -> auto-routes to a Dedicated
    # endpoint; the App fields below keep their defaults.
    - repo_id: Qwen/Qwen3-Embedding-0.6B
      revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3 # HF sha of `main`, 2026-09-19
      native_dimensions: 1024
      # The card says MRL 32-1024; empty because the 1024-d vector_index needs
      # nothing smaller. The client truncates client-side (ADR-009 §3) — list a
      # size only when a config asks for it.
      matryoshka_dimensions: []
      # Byte-exact from the model card's helper:
      #   f'Instruct: {task_description}\nQuery:{query}'  (no space after Query:)
      # MUST stay double-quoted: single quotes would make \n a literal backslash-n.
      query_prompt: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"
      document_prompt: "" # Qwen3 instructs the query side only
    # NOT in Modal's catalog, and its Hub card names no base model -> vLLM App,
    # which is also the only way to get the architecture override + MEAN
    # pooling a managed recipe cannot express.
    - repo_id: voyageai/voyage-4-nano
      revision: 67fabc9bef010dabc5f6024aa1b1b6b93410426f # HF sha of `main`, 2026-09-19
      gpu: A10 # Modal's GPU string (docs/guide/gpu, 2026-09-19); there is no "A10G"
      cpu: 4
      memory_mb: 16384
      # config.json `num_labels: 2048`, NOT `hidden_size: 1024`: the custom
      # modeling_qwen3_bidirectional.py AutoModel applies a learned
      # nn.Linear(1024, 2048) head to last_hidden_state (safetensors
      # `linear.weight` is [2048, 1024]), and vLLM's own
      # VoyageQwen3BidirectionalEmbedModel returns it untruncated. The head is
      # NOT a sentence-transformers Dense module, so modules.json never shows
      # it — 1_Pooling/config.json's `word_embedding_dimension: 2048` does.
      # 1024 is a Matryoshka TRUNCATION of this, which is exactly what
      # models.search_embedding.dimensions: 1024 asks the server for.
      native_dimensions: 2048
      matryoshka_dimensions: [256, 512, 1024, 2048]
      max_model_len: 32768
      query_prompt: "Represent the query for retrieving supporting documents: "
      document_prompt: "Represent the document for retrieval: "
      # Model-specific extras for the APP scripts only. `--max-num-seqs` is
      # accepted here too (Modal's own 8B embedding recipe sets it to 32 to
      # bound the KV cache); no seed needs it — vLLM's default holds.
      extra_server_args:
        "--convert": embed
        "--pooler-config": '{"pooling_type":"MEAN"}'
        "--hf-overrides": '{"architectures":["VoyageQwen3BidirectionalEmbedModel"]}'
        "--dtype": bfloat16
        "--enforce-eager": ""
        "--trust-remote-code": ""
  llm_models:
    # In Modal's endpoint catalog (2026-09-20) -> auto-routes to a Dedicated
    # endpoint; the App fields keep their defaults. Chosen over the equally
    # listed google/gemma-3-1b-it, which is `gated: manual` on the Hub
    # (HF API, 2026-09-20) while this one is ungated Apache-2.0.
    - repo_id: Qwen/Qwen3.5-0.8B
      revision: 2fc06364715b967f1860aea9cf38778875588b17 # HF sha of `main`, 2026-09-20
    # NOT in Modal's catalog (arch Lfm2ForCausalLM; its base
    # LiquidAI/LFM2.5-350M-Base is not either) -> SGLang App.
    - repo_id: LiquidAI/LFM2.5-350M
      revision: 9e6c6ccf47cd318696e137d381a7ded8fe4df09f # HF sha of `main`, 2026-09-20
      gpu: A10
      n_gpus: 1
      cpu: 4
      memory_mb: 16384
      max_model_len: 32768 # the card's context is 128000; 32K keeps the KV cache small on one A10

observability:
  enabled: true
  # Per-model USD price per 1,000,000 tokens. Used to compute the manual
  # total_cost on Voyage embedding spans (Opik does not natively cost Voyage).
  # Verified against https://docs.voyageai.com/docs/pricing (September 2026).
  # A model absent from this map yields total_cost=0 (usage still recorded).
  # The 4 series is the current text family; the voyage-3.x rows are LEGACY but
  # still served, so a `TREE_MODELS__SEARCH_EMBEDDING__MODEL=voyage-3.5`
  # override still costs instead of silently reporting $0.
  embedding_price_per_1m_tokens:
    voyage-4-large: 0.12
    voyage-4: 0.06
    voyage-4-lite: 0.02
    voyage-code-4: 0.12
    voyage-3.5: 0.06
    voyage-3: 0.06
    voyage-3.5-lite: 0.02
    voyage-3-large: 0.18
    voyage-3-lite: 0.02
    voyage-code-3: 0.18
    voyage-finance-2: 0.12
    voyage-law-2: 0.12
    voyage-multimodal-3: 0.12
    voyage-multimodal-3.5: 0.12
