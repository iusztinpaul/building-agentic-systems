# Override per-environment by setting APP_CONFIG_PATH to a different YAML file.
#
# This file holds ONLY static memory config (models, extraction, query, dream,
# concurrency, prefect, mcp, observability). Data-ingestion sources are operator
# DATA and live under the repo-root `sources/` directory (`sources/backfill.yaml`
# + `sources/listen.yaml`), loaded by `tree.config.sources` — see ADR-003.

# Memory modes (ADR-006). ONE switch decides how much of the memory half runs:
#   rag      — clean -> two-level chunk (parent/child) -> embed children ->
#              load rows; retrieval is parent-document hybrid search
#              (vector + text, RRF) over child chunks. Node rows only:
#              no edges, no LLM entity extraction. (The Chapter-4 system.)
#   graphrag — everything `rag` does PLUS structural edges (part_of, next),
#              LLM entity extraction over parent chunks, entity resolution,
#              dedup, `mentions` edges, and graph expansion at retrieval.
#              (What Chapter 8 adds.)
# Read once at flow entry / MCP-server boot / CLI start, never per request.
# Default `graphrag` keeps an unchanged checkout behaving as before.
# Env override: TREE_MEMORY__MODE=rag. Both modes write the same `memory`
# collection and both start from scratch — there is NO migration between them.
memory:
  mode: graphrag
  # Two-level chunking (ADR-006 §6). Sizes are tiktoken `cl100k_base` TOKENS.
  #   strategy — the same splitter at both levels:
  #     recursive     markdown headings -> paragraphs -> sentences -> tokens,
  #                   greedily merged up to `size`; parents carry a heading_path.
  #     fixed_tokens  plain sliding token window (the Chapter-4 first version).
  #   parent — retrieval + LLM-extraction unit, never embedded.
  #   child  — the embedded search unit; must stay smaller than the parent.
  # Env overrides work as usual, e.g. TREE_MEMORY__CHUNKING__CHILD__SIZE=128.
  chunking:
    strategy: recursive
    parent:
      size: 4096
      overlap: 0
    child:
      size: 256
      overlap: 32

models:
  llm:
    provider: gemini
    model: gemini-3.1-flash-lite
  # Transient embedding used only by resolution's semantic stage
  # (computed on the entity NAME, dropped afterward, never persisted).
  resolution_embedding:
    provider: voyage
    model: voyage-3.5
    dimensions: 1024
  # Persisted embedding used for dedup + search/query. Its output is the
  # node `embedding` field and the live mongot `vector_index`
  search_embedding:
    provider: voyage
    model: voyage-3.5
    dimensions: 1024
  embedding_batch:
    max_inputs: 1000
    max_total_tokens: 10000
    max_input_tokens: 32000
    dispatch_concurrency: 1

extraction:
  llm_concurrency: 5
  doc_concurrency: 1
  dedup_concurrency: 8
  resolution:
    fuzzy_threshold: 0.85
    semantic_threshold: 0.80
    type_strict: true
    max_candidates_per_type: 1000
    embedding_cache_max_size: 10000
  dedup:
    enabled: true
    auto_merge_threshold: 0.95
    flag_threshold: 0.85
    use_fuzzy_matching: true
    fuzzy_threshold: 0.90
    max_candidates: 10
    match_same_type_only: true
    merge_strategy: keep_primary
    supersession_candidate_cap: 8

query:
  top_k: 10
  max_hops: 1
  rrf_k: 60
  embedding_batch_size: 64

dream:
  enabled: true
  cron: "0 4 * * *"
  dry_run: true
  # Cap on candidate pairs examined per run. Once hit, the sweep stops
  # driving and records cap_hit=True in its stats.
  max_pairs: 10000
  # Gate for the LLM contradiction/supersession sweep (#052). Off by
  # default: prefs/facts get the normal semantic + fuzzy dedup with ZERO
  # LLM calls. Flip to true to run the Gemini contradiction judge over the
  # incremental delta (cost: bounded LLM calls per partition).
  enable_supersession_judge: false

# Pipeline-parallelism + Voyage rate-limiting
concurrency:
  # Requests/minute the shared free-tier Voyage key allows. Drives the
  # server-side `voyage-embeddings` Prefect global concurrency limit
  # (limit = voyage_rpm, slot-decay-per-second = voyage_rpm / 60). Create/update
  # it on the Prefect server with `prefect gcl create voyage-embeddings --limit
  # <voyage_rpm> --slot-decay-per-second <voyage_rpm/60>`. Raise this + re-run
  # that command after adding a payment method — no code change needed.
  voyage_rpm: 3
  # Tokens/minute the key allows. Held by config (the embedding_batch
  # max_total_tokens cap), not yet a second token-weighted limiter.
  voyage_tpm: 10000
  # Prefect runner global concurrency limit
  runner_global_limit: 6

prefect:
  # Register the OPTIONAL deployments (optional=True in orchestrator.py). Prefect
  # Cloud's FREE TIER caps a workspace at 5 deployments and the core set spends all
  # 5 — see README.md "Serving workflows". Set true on a paid plan or a self-hosted
  # server. (Env override: TREE_PREFECT__DEPLOY_OPTIONAL=true.)
  deploy_optional: false

mcp:
  max_retries: 1
  max_results: 10

# YouTube ETL: the bounded wait for ONE Bright Data transcript collection
# (ADR-004). Credential presence is the backend switch — there is no `enabled`
# flag and no new env var.
youtube:
  # Measured: ~173s to collect a single video; 600 matches the Bright Data CLI
  # default. Hitting it falls the whole batch back to Gemini, it is not a failure.
  brightdata_timeout_seconds: 600
  brightdata_poll_interval_seconds: 10

observability:
  enabled: true
  # Per-model USD price per 1,000,000 tokens. Used to compute the manual
  # total_cost on Voyage embedding spans (Opik does not natively cost Voyage).
  # Verified against https://docs.voyageai.com/docs/pricing (June 2026).
  # A model absent from this map yields total_cost=0 (usage still recorded).
  embedding_price_per_1m_tokens:
    voyage-3.5: 0.06
    voyage-3: 0.06
    voyage-3.5-lite: 0.02
    voyage-3-large: 0.18
    voyage-3-lite: 0.02
    voyage-code-3: 0.18
    voyage-finance-2: 0.12
    voyage-law-2: 0.12
    voyage-multimodal-3: 0.12
    voyage-multimodal-3.5: 0.12
