# Application configuration for Tree (Your Rooted Personal Assistant).
# Override per-environment by setting APP_CONFIG_PATH to a different YAML file.

sources:
  - uri: https://www.decodingai.com/feed
    type: substack_rss
  - uri: https://maximelabonne.substack.com/feed
    type: substack_rss
  - uri: https://modelcraft.substack.com/feed
    type: substack_rss
  - uri: https://www.latent.space/feed
    type: substack_rss
  - uri: https://alexeyondata.substack.com/feed
    type: substack_rss
  - uri: https://www.decodingai.com/p/ai-agents-foundations-course
    type: substack_article
  - uri: https://www.decodingai.com/p/ai-workflows-vs-agents-the-autonomy
    type: substack_article
  - uri: https://www.decodingai.com/p/context-engineering-2025s-1-skill
    type: substack_article
  - uri: https://www.decodingai.com/p/llm-structured-outputs-the-only-way
    type: substack_article
  - uri: https://www.decodingai.com/p/stop-building-ai-agents-use-these
    type: substack_article
  - uri: https://www.decodingai.com/p/tool-calling-from-scratch-to-production
    type: substack_article
  - uri: https://www.decodingai.com/p/ai-agents-planning
    type: substack_article
  - uri: https://www.decodingai.com/p/building-production-react-agents
    type: substack_article
  - uri: https://www.decodingai.com/p/how-does-memory-for-ai-agents-work
    type: substack_article
  - uri: https://www.decodingai.com/p/stop-converting-documents-to-text
    type: substack_article
  - uri: librarian-bots/arxiv-metadata-snapshot
    type: huggingface_dataset
    max_samples: 10
    fetch_content: false
    batch_size: 50
    concurrency: 10
  # Arbitrary URLs (blogs, news, repos, profiles) ingested via the URL
  # dispatcher; specialized pipelines (e.g. Substack) win when they match,
  # otherwise the URL falls back to Bright Data Web Unlocker.
  - uri: https://www.reddit.com/r/AI_Agents/comments/1su8zwi/i_almost_built_rag_for_my_notes_then_realized_i/
  - uri: https://www.anthropic.com/engineering/harness-design-long-running-apps
  # YouTube channel feed (Atom). Recent videos on the channel are ingested
  # one by one via a chained transcript fetcher: the free `youtube-transcript-api`
  # primary, then a paid Gemini 2.5 Flash fallback for videos the primary
  # cannot transcribe (CC disabled, age-gated, region-locked). A WARNING is
  # logged when the chain advances to Gemini, and a final WARNING is logged
  # only if BOTH backends fail (the video is then skipped, not retried).
  - uri: https://www.youtube.com/feeds/videos.xml?channel_id=UCkyHDwRWMEluOEYmOGJ_2nw
    type: youtube_rss
  # Single YouTube video (transcript via the same chained fetcher;
  # best-effort metadata via oEmbed).
  - uri: https://www.youtube.com/watch?v=eYaWxljC4sA
    type: youtube_video

models:
  llm:
    provider: gemini
    model: gemini-3.1-flash-lite
  embedding:
    provider: sentence-transformers
    model: all-MiniLM-L6-v2
    dimensions: 384

extraction:
  chunk_size: 512
  chunk_overlap: 64
  llm_concurrency: 5
  resolution:
    fuzzy_threshold: 0.85
    semantic_threshold: 0.80
    type_strict: true
    max_candidates_per_type: 1000
    embedding_cache_max_size: 10000
  dedup:
    enabled: true
    auto_merge_threshold: 0.95
    flag_threshold: 0.85
    use_fuzzy_matching: true
    fuzzy_threshold: 0.90
    max_candidates: 10
    match_same_type_only: true
    merge_strategy: keep_primary

query:
  top_k: 10
  max_hops: 1
  rrf_k: 60
  embedding_batch_size: 64

mcp:
  max_retries: 1
  max_results: 10
