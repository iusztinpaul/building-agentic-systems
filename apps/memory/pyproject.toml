[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tree-memory"
version = "0.1.0"
description = "Tree memory: ETL pipelines + knowledge-graph memory + FastMCP server for Tree."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beanie>=2.0.1",
    "pymongo>=4.16.0",
    "feedparser>=6.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "pydantic-settings>=2.9",
    "prefect>=3.6.19",
    "langchain-mongodb>=0.5",
    "langchain-google-genai>=2.1",
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.12.0",
    "click>=8.0",
    "pyvis>=0.3",
    "networkx>=3.0",
    "google-genai>=1.65.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "sentence-transformers>=4.0",
    "modal>=1.3.5",
    "datasets>=3.0",
    "fastmcp>=3.1.0",
    "youtube-transcript-api>=1.2.4",
    "rapidfuzz>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tree"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.2",
    "pre-commit>=4.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Default per-test timeout (seconds). The slowest legitimate tests today are
# the Prefect-e2e + mongot-convergence ones marked ``@pytest.mark.slow`` and
# they top out around 10s; 300s leaves ample headroom while still catching
# true hangs. Individual tests can opt into more via ``@pytest.mark.timeout(N)``.
timeout = 300
timeout_method = "signal"
markers = [
    "slow: marks tests that take >3s or require vector-index (mongot) convergence or full Prefect e2e. Excluded by default in `make memory-integration-tests`; included in CI and `make memory-integration-tests-all`.",
    "requires_mongot: marks tests that need a working Atlas Search / mongot (live `$vectorSearch` or `create_search_index`). Excluded from CI (mongot's gRPC channel is unreliable on GitHub runners); included in local runs with the full `docker-compose.yml` infra. Orthogonal to `slow`.",
]
filterwarnings = [
    "ignore:Logger 'prefect:UserWarning",
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]
