name: CD

# Sync the Prefect Cloud deployment definitions with the code on every push to
# main — but only AFTER CI has gone green for that commit. We trigger off the CI
# workflow's completion (workflow_run) rather than a bare `push` so a failing
# test suite never ships a broken deployment.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Serialize deploys per source branch and cancel any in-progress one: if two
# commits land back-to-back, only the latest deploy survives. ``head_branch`` is
# the branch whose CI completed (``github.ref`` here is just the default branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy-prefect:
    name: deploy prefect deployments
    runs-on: ubuntu-latest
    # Run only when CI succeeded on a push (not a PR run, not a failed run).
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit that passed CI, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install
        working-directory: apps/memory

      - name: Install dependencies
        run: uv sync
        working-directory: apps/memory

      - name: Apply Prefect deployments to Prefect Cloud
        # `prefect_pipelines.py` re-applies the Cloud deployment definitions
        # (deploy_cloud_pipelines: git-sourced code, Managed work pool) and
        # exits — Prefect hosts the workers. It needs ONLY the Prefect API
        # creds: the managed-run env and the GitHub clone token are
        # `{{ prefect.blocks/variables.* }}` references resolved at run time
        # (seeded by `prefect_pipelines_setup.py up`). The mock app keys below
        # exist because importing the flow modules constructs settings/clients;
        # the deploy itself only talks to the Prefect API.
        run: uv run python deploy/prefect_pipelines.py
        working-directory: apps/memory
        env:
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          GOOGLE_API_KEY: mock-google-api-key
          VOYAGE_API_KEY: mock-voyage-api-key
          MODAL_EMBEDDING_API_KEY: mock-modal-embedding-api-key
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_INITDB_ROOT_USERNAME: tree
          MONGO_INITDB_ROOT_PASSWORD: tree
          MONGO_INITDB_DATABASE: tree
