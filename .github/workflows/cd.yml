name: CD

# Sync the Prefect Cloud deployments with main on every push (a direct push or a
# merged PR) — but only AFTER CI has gone green for that commit. We trigger off
# the CI workflow's completion (workflow_run) rather than a bare `push` so a
# failing test suite never ships. The deployments are pinned to that commit's SHA
# (GIT_REF below): every managed flow run clones exactly the tested code, so a
# red push to main never runs there — it waits for the next green one. (The MCP
# server on Prefect Horizon is NOT gated here: Horizon redeploys it on every push.)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Serialize deploys per source branch and cancel any in-progress one: if two
# commits land back-to-back, only the latest deploy survives. ``head_branch`` is
# the branch whose CI completed (``github.ref`` here is just the default branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy-prefect:
    name: deploy prefect deployments
    runs-on: ubuntu-latest
    # Run only when CI succeeded on a push (not a PR run, not a failed run).
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit that passed CI, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install
        working-directory: apps/memory

      - name: Install dependencies
        run: uv sync
        working-directory: apps/memory

      - name: Apply Prefect deployments to Prefect Cloud
        # `prefect_pipelines.py` re-applies the Cloud deployment definitions
        # (deploy_cloud_pipelines: git-sourced code pinned to GIT_REF, Managed
        # work pool) and exits — Prefect hosts the workers. It needs ONLY the
        # Prefect API creds: the managed-run env and the GitHub clone token are
        # `{{ prefect.blocks/variables.* }}` references resolved at run time
        # (seeded by `prefect_pipelines_setup.py up`). The mock app keys below
        # exist because importing the flow modules constructs settings/clients;
        # the deploy itself only talks to the Prefect API.
        #
        # Pinning makes order matter: a re-run of an OLD commit's CI would roll
        # prod back to it, so only the tip of main deploys. A newer commit has
        # its own CI run, and its CD deploys it once green (a red tip deploys
        # nothing: pin by hand with `GIT_REF=<sha> make memory-deploy-prefect`).
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GIT_REF" ]; then
            echo "::notice::Skipped: $GIT_REF is no longer the tip of main ($tip)."
            exit 0
          fi
          uv run python deploy/prefect_pipelines.py
        working-directory: apps/memory
        env:
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          # The commit that passed CI — every managed run clones exactly this.
          GIT_REF: ${{ github.event.workflow_run.head_sha }}
          GOOGLE_API_KEY: mock-google-api-key
          VOYAGE_API_KEY: mock-voyage-api-key
          MODAL_PROXY_TOKEN_ID: mock-modal-proxy-token-id
          MODAL_PROXY_TOKEN_SECRET: mock-modal-proxy-token-secret
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_INITDB_ROOT_USERNAME: tree
          MONGO_INITDB_ROOT_PASSWORD: tree
          MONGO_INITDB_DATABASE: tree
