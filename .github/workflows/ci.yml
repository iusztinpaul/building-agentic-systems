name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep only the latest run per branch/PR: a new push cancels any in-progress run
# for the same ref so we never burn runners on superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # MongoDB (used by docker-compose and tests)
  MONGO_HOST: localhost
  MONGO_PORT: "27017"
  MONGO_INITDB_ROOT_USERNAME: tree
  MONGO_INITDB_ROOT_PASSWORD: tree
  MONGO_INITDB_DATABASE: tree
  # MONGOT_PORT intentionally unset — mongot is not started on CI (see the
  # "Start infrastructure" step). Tests that need mongot are skipped via
  # ``-m "not requires_mongot"``.
  # Prefect
  PREFECT_PORT: "4200"
  PREFECT_API_URL: http://127.0.0.1:4200/api
  # Mock API keys (not called in unit tests)
  GOOGLE_API_KEY: mock-google-api-key
  VOYAGE_API_KEY: mock-voyage-api-key
  MODAL_EMBEDDING_API_KEY: mock-modal-embedding-api-key

jobs:
  memory:
    name: memory (python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install
        working-directory: apps/memory

      - name: Install dependencies
        # --extra local-models: the model unit tests import sentence-transformers / modal.
        run: uv sync --extra local-models
        working-directory: apps/memory

      - name: Format check
        run: uv run ruff format --check src/ tests/ scripts/ deploy/
        working-directory: apps/memory

      - name: Lint check
        run: uv run ruff check src/ tests/ scripts/ deploy/
        working-directory: apps/memory

      - name: Create empty .env for docker-compose
        # ``docker-compose.yml`` declares ``env_file: [.env]`` on the
        # ``prefect-worker`` service (added in commit 133fb10). Even when we
        # target unrelated services with ``up -d <names>`` / ``stop <names>``,
        # Docker Compose still validates the merged config and aborts with
        # ``env file ... not found`` if ``.env`` is missing on the runner. An
        # empty file satisfies the lookup without leaking secrets — the
        # prefect-worker service is never started in CI so its env contents
        # don't matter.
        run: touch .env

      - name: Start infrastructure
        # mongot is intentionally NOT started on CI. Its Search Index Management
        # gRPC channel is unreliable on GitHub runners (see CI run 25989844295:
        # 16 ``Failed to establish connectivity of gRPC channel before deadline``
        # errors + 7 five-minute hangs on live ``$vectorSearch``). Tests that
        # need mongot are tagged ``@pytest.mark.requires_mongot`` and skipped
        # below; they're exercised locally with the full ``docker-compose.yml``
        # stack instead. ``mongodb-init`` still runs to bring up the replica
        # set; the keyfile / mongot-user override lives in ``docker-compose.ci.yml``.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d mongodb mongodb-init prefect-server

      - name: Wait for MongoDB to be ready
        run: |
          echo "Waiting for MongoDB to be healthy..."
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T mongodb mongosh \
              --eval "db.adminCommand('ping')" 2>/dev/null; then
              echo "MongoDB is ready."
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done

      - name: Wait for replica set to initialize
        run: |
          echo "Waiting for replica set..."
          for i in $(seq 1 30); do
            STATUS=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T mongodb mongosh \
              -u "$MONGO_INITDB_ROOT_USERNAME" \
              -p "$MONGO_INITDB_ROOT_PASSWORD" \
              --authenticationDatabase admin \
              --quiet --eval "try { rs.status().ok } catch(e) { 0 }" 2>/dev/null || echo 0)
            if [ "$STATUS" = "1" ]; then
              echo "Replica set is ready."
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done

      - name: Wait for Prefect to be ready
        run: |
          echo "Waiting for Prefect server..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4200/api/health > /dev/null 2>&1; then
              echo "Prefect server is ready."
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done

      - name: Unit tests
        run: uv run pytest tests/unit
        working-directory: apps/memory
        env:
          PYTHONPATH: ./src/

      - name: Integration tests (excludes @pytest.mark.requires_mongot)
        # ``-m "not requires_mongot"`` skips the mongot/Atlas-Search subset
        # (see the "Start infrastructure" comment above). Run SPLIT BY AREA, one
        # pytest process per area (data / memory / mcp / rest): the suite shares
        # one session-scoped DB and a fire-and-forget async write from one area
        # (the MCP ``search_web`` background ingest) was landing during a LATER
        # area's test and polluting it — a write that arrives after the per-test
        # wipe can't be cleaned. Separate processes give each area its own DB
        # lifecycle. Each area passes on its own; only the mixed single-process
        # run failed. Still sequential (no ``-n auto``) — the shared-DB cleanup
        # fixture collides in parallel. ``--timeout=300`` is a per-test hang net.
        run: |
          uv run pytest tests/integration/data -m "not requires_mongot" --timeout=300
          uv run pytest tests/integration/memory -m "not requires_mongot" --timeout=300
          uv run pytest tests/integration/mcp -m "not requires_mongot" --timeout=300
          uv run pytest tests/integration --ignore=tests/integration/data --ignore=tests/integration/memory --ignore=tests/integration/mcp -m "not requires_mongot" --timeout=300
        working-directory: apps/memory
        env:
          PYTHONPATH: ./src/

      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down

  harness:
    name: harness (typescript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/harness

      - name: Biome check (format + lint + organize-imports)
        run: bunx biome check src tests
        working-directory: apps/harness

      - name: Typecheck
        run: bun tsc --noEmit
        working-directory: apps/harness

      - name: Unit tests
        run: bun test tests/unit
        working-directory: apps/harness

      - name: Integration tests
        run: bun test tests/integration
        working-directory: apps/harness
