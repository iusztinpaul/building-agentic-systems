# CI override for ``docker-compose.yml``.
#
# Differences from the local dev stack:
# * Runs MongoDB without keyfile auth enforcement (``mongod.ci.conf`` has no
#   ``security: keyFile`` block) — but we still provision the ``tree`` root
#   user so SCRAM auth succeeds for clients (tests, the wait-for-replica-set
#   step) that connect with credentialed URIs from ``settings.mongo.mongo_uri``.
# * Skips creation of the dedicated ``mongot`` user — mongot is not started in
#   CI because its Search Index Management gRPC channel is unreliable on
#   GitHub runners (CI run 25989844295).
# * Uses ``mongod.ci.conf`` (no security/keyFile, ``skipAuthentication...`` on)
#   so the mongod boots even though we're not bringing mongot up.
#
# To bring up the full mongot stack locally, just use the base
# ``docker-compose.yml``.
#
# Note: the merged compose config (``docker compose -f docker-compose.yml -f
# docker-compose.ci.yml config``) still LISTS the ``mongot`` service because
# Docker Compose overrides cannot remove a service from the base file — only
# individual fields. CI never starts mongot, though: the workflow's ``docker
# compose up -d`` command explicitly names ``mongodb mongodb-init prefect-server``
# and omits mongot.
services:
  mongodb:
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ""
      MONGODB_INITDB_ROOT_PASSWORD: ""
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
      - ./docker/mongodb/mongod.ci.conf:/etc/mongod.conf:ro

  mongodb-init:
    entrypoint: >
      mongosh --host mongodb:27017 --eval '
        try {
          rs.status();
          print("Replica set already initialized.");
        } catch(e) {
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
          print("Replica set initiated.");
        }

        sleep(2000);

        const adminDb = db.getSiblingDB("admin");
        try {
          adminDb.createUser({
            user: "tree",
            pwd: "tree",
            roles: [{ role: "root", db: "admin" }]
          });
          print("tree user created.");
        } catch(e) {
          print("tree user already exists or error: " + e.message);
        }
      '
