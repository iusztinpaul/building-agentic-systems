services:
  mongodb:
    command: ["--replSet", "rs0", "--bind_ip_all", "--setParameter", "mongotHost=twin-mongot:27028", "--setParameter", "searchIndexManagementHostAndPort=twin-mongot:27028", "--setParameter", "skipAuthenticationToSearchIndexManagementServer=false", "--setParameter", "useGrpcForSearch=true"]
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_INITDB_ROOT_USERNAME}",
          "-p",
          "${MONGO_INITDB_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
