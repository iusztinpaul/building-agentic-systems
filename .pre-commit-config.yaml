fail_fast: false

repos:
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json5]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Keep in sync with the ruff dev dep in apps/memory/pyproject.toml
    # so pre-commit and `make memory-lint-check` use the same parser (needed for Python 3.14 PEP 758 syntax).
    rev: v0.15.2
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

  # Harness (TypeScript/Bun) — Biome covers format + lint + organize-imports in one pass.
  # Uses the harness's local biome.json via `bunx biome`; requires Bun to be installed locally.
  - repo: local
    hooks:
      - id: biome-check-harness
        name: biome check (harness)
        language: system
        entry: bash -c 'cd apps/harness && bunx biome check --write src tests'
        pass_filenames: false
        files: ^apps/harness/.*\.(ts|tsx|js|jsx|json)$
