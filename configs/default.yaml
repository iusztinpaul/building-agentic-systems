# Application configuration for the digital twin system.
# Override per-environment by setting APP_CONFIG_PATH to a different YAML file.

sources:
  substack:
    - https://www.decodingai.com/feed

models:
  llm:
    provider: gemini
    model: gemini-2.5-flash-lite
  embedding:
    provider: openai_compatible
    model: voyageai/voyage-4-nano
    dimensions: 512
    base_url: https://your-workspace--vllm-embedding-voyage-4-nano-serve.modal.run/v1
    mock: true

extraction:
  chunk_size: 512
  chunk_overlap: 64
  llm_concurrency: 5
  similarity_threshold: 0.85

query:
  top_k: 10
  max_hops: 3
  rrf_k: 60
  embedding_batch_size: 64
