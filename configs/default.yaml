# Application configuration for the digital twin system.
# Override per-environment by setting APP_CONFIG_PATH to a different YAML file.

sources:
  substack:
    - https://www.decodingai.com/feed
  huggingface_arxiv_dataset:
    max_samples: 10
    fetch_content: false
    batch_size: 50
    concurrency: 10

models:
  llm:
    provider: gemini
    model: gemini-2.5-flash-lite
  embedding:
    provider: sentence-transformers
    model: all-MiniLM-L6-v2
    dimensions: 384

extraction:
  chunk_size: 512
  chunk_overlap: 64
  llm_concurrency: 5
  similarity_threshold: 0.85

query:
  top_k: 10
  max_hops: 3
  rrf_k: 60
  embedding_batch_size: 64
